[build-system]
requires = ["setuptools>=42", "wheel", "setuptools-git-versioning"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["tomobar", "tomobar.*"]

[tool.setuptools.package-data]
tomobar = ["*.cu", "*.cuh"]  # include cuda kernels in package

[tool.setuptools-git-versioning]
enabled = true
template = "{tag}"
dev_template = "{tag}"

[project]
name = "tomobar"
version = "2026.4.0.0"
description = "TOmographic MOdel-BAsed Reconstruction (ToMoBAR) software"
readme = "Readme.md"
license = {text = "GPLv3"}
authors = [
    {name = "Daniil Kazantsev", email = "daniil.kazantsev@diamond.ac.uk"},
    {name = "Viktor Nikitin", email = "vnikitin@anl.gov"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.10",
    "Environment :: GPU :: NVIDIA CUDA"
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "cupy>=14",
    "astra-toolbox>=2.5",
    "scipy",
    "pillow",
    "scikit-image",
]

[project.optional-dependencies]
visualisation = ["matplotlib"]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "ruff==0.16.7",
  "black==26.5.1",
  "pre-commit==4.6.2",
  "pyright==1.1.414",
  "pydocstyle",
  "toml",
  "imageio",
  "h5py"
]

[project.urls]
"Repository" = "https://github.com/dkazanc/ToMoBAR"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
   "-vv",
   "-ra",
   "-q",
   "--tb=short",
   "--strict-markers",
]
markers = [
    "gpu: requires a working CUDA device (including tests using host arrays with ASTRA)",
    "perf: opt-in performance measurements; run with --performance",
    "full: opt-in large memory/computation cases; run with --full",
]
testpaths = [
    "tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::scipy.stats.ConstantInputWarning",
]

[tool.coverage.run]
data_file = "/tmp/tomobar.coverage"

[tool.coverage.paths]
# Tests are run from installed location, map back to the src directory
source = [
    "tomobar",
    "**/site-packages/"
]

[tool.pydocstyle]
convention = "google"
add-ignore = [
    "D100", # Ignore missing docstrings in public modules
    "D104", # Ignore missing docstrings in public packages
    "D105", # Standard magic methods follow their documented Python protocols
    "D107", # Constructor arguments are documented on the class
    "D418", # Retain the existing overload-docstring workaround; See: https://github.com/PyCQA/pydocstyle/issues/525
]

[tool.black]
line-length = 88
target-version = ["py312"]
required-version = "26.5.1"
force-exclude = "/(benchmarks|docs/build)/"
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
required-version = "==0.16.7"
target-version = "py312"
line-length = 88
extend-exclude = ["benchmarks", "docs/build"]
force-exclude = true

[tool.ruff.lint]
# Black handles formatting. Keep the initial lint set focused on errors,
# package documentation and selected bug-prone Python patterns.
select = ["F", "E4", "E7", "E9", "D", "B006", "B007", "B018", "B023", "B904"]
ignore = ["D100", "D104", "D105", "D107", "D418"]

[tool.ruff.lint.per-file-ignores]
# Tests import optional GPU libraries before importing production GPU modules.
"tests/**" = ["D", "E402"]
# Demos use staged imports to keep each example section self-contained.
"Demos/**" = ["D", "E402"]
"docs/**" = ["D"]
".github/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
# Expand this list only after the added modules pass without blanket suppressions.
include = [
    "tomobar/_validation.py",
    "tomobar/geometry.py",
    "tomobar/options.py",
    "tomobar/_solvers/options.py",
    "tomobar/_solvers/types.py",
    "tomobar/reconstruction/state.py",
]
pythonVersion = "3.12"
typeCheckingMode = "basic"
stubPath = "typings"
reportUnnecessaryTypeIgnoreComment = "error"
