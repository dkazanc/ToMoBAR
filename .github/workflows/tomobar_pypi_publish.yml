name: Test and publish Python package

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    name: CPU tests and wheel validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install CPU test and build dependencies
        run: python -m pip install --upgrade build twine numpy scipy scikit-image matplotlib pytest
      - name: Run CPU-compatible tests
        env:
          MPLBACKEND: Agg
        # CuPy and ASTRA remain optional; CUDA cases are excluded explicitly.
        run: python -m pytest --cpu-only
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Install wheel without GPU dependencies
        run: python -m pip install --no-deps dist/*.whl
      - name: Check installed wheel outside the source tree
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/.github/scripts/check_wheel.py"
      - name: Store validated distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  pypi-publish:
    name: Publish release to PyPI
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tomobar
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
