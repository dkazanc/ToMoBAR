name: tomobar_docs

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-docs-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create documentation environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          # Install explicitly: hosted runners may not provide bundled Conda.
          miniforge-version: latest
          auto-update-conda: false
          activate-environment: tomobar-docs
          environment-file: ./docs/source/doc-conda-requirements.yml
      - name: Build html
        run: sphinx-build -a -E -W --keep-going -b html ./docs/source/ ./docs/build/
      - name: Store built documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: docs/build/
          include-hidden-files: true
          if-no-files-found: error

  publish-docs:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build-docs-publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Retrieve validated documentation
        uses: actions/download-artifact@v8
        with:
          name: documentation
          path: docs/build/
      - name: Install publication tool
        run: python -m pip install ghp-import
      - name: Publish documentation
        run: ghp-import -n -p -f ./docs/build
        env:
          GITHUB_TOKEN: ${{ github.token }}
