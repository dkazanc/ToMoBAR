name: tomobar_conda_upload

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Conda build tools
        uses: conda-incubator/setup-miniconda@v4
        with:
          # Hosted runners do not necessarily include a Conda installation.
          miniforge-version: latest
          activate-environment: conda-build
          environment-file: .github/conda-build.yml

      - name: Build and upload the package to conda cloud
        run: bash ./.scripts/conda_upload.sh
        env:
          ANACONDA_API_TOKEN: ${{ secrets.HTTOMO_TOKEN_26 }}
