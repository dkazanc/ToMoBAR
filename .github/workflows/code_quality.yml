name: Code quality

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff and Black
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2
      - name: Validate pre-commit configuration
        run: pre-commit validate-config
      - name: Check GitHub Actions workflows
        run: pre-commit run actionlint --all-files --show-diff-on-failure
      - name: Check YAML configuration
        run: pre-commit run check-yaml --all-files --show-diff-on-failure
      - name: Check TOML configuration
        run: pre-commit run check-toml --all-files --show-diff-on-failure
      - name: Check Ruff rules
        run: pre-commit run ruff-check --all-files --show-diff-on-failure
      - name: Check Black formatting
        run: pre-commit run black --all-files --show-diff-on-failure

  types:
    name: Pyright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2
      - name: Check CPU-safe metadata types
        run: pre-commit run pyright --all-files --show-diff-on-failure
