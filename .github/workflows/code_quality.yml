name: Code quality

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff and Black
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2
      - name: Check Ruff rules
        run: pre-commit run ruff-check --all-files --show-diff-on-failure
      - name: Check Black formatting
        run: pre-commit run black --all-files --show-diff-on-failure

  types:
    name: Pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2
      - name: Check CPU-safe metadata types
        run: pre-commit run pyright --all-files --show-diff-on-failure
